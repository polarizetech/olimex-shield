# docs-site.toml: what this repository's docs site is generated from.
# Built by https://github.com/polarizetech/automatic-documentation-site (`docsite dev .`).
# Nothing on the site is written by hand: fix a page by fixing the file it names.

[site]
name = "olimex-shield"
kicker = "Arduino UNO + Olimex SHIELD-EKG-EMG"
title = "Record EEG, ECG or EMG with a C$75 single-channel amplifier."
tagline = "The sketch that runs on the board, a bridge that reads it over USB and checks whether the signal can be trusted, and a browser workbench to watch, record, tag, play back and export to EEG-BIDS. **This is not a medical device.**"
repo = "polarizetech/olimex-shield"
branch = "main"
private = false
polarize_ui = "v0.5.15"

