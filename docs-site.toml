# ── Source ──────────────────────────────────────────────────────────────────────────────────
# The repository keeps its Python as loose modules (no packages), so each source is a folder.
[[source]]
path = "apps/server"
language = "python"
name = ""
slug = "bridge-api"
title = "Bridge (Python)"
group = "Reference"
recursive = false
exclude = ["dev_check*.py"]
lead = "`apps/server`: the one process that holds the board's serial port, and the checks that say whether what it reads can be trusted. Modules are imported by file name."

[[source]]
path = "apps/web"
language = "python"
name = ""
slug = "workbench-api"
title = "Workbench (Python)"
group = "Reference"
exclude = ["dev_check*.py", "vendor/*"]
lead = "`apps/web`: the workbench server, the readout catalogue that says what this front end can carry, the hookup guide and the montage drawings."

[[source]]
path = "apps"
language = "javascript"
name = "apps"
slug = "browser-api"
title = "Browser modules (JavaScript)"
group = "Reference"
exclude = ["web/vendor/*", "dev_check_js.mjs", "*/dev_check_js.mjs"]
lead = "What a page imports: the playback helpers, the fail-safe session recorder and the `<signal-panel>` element. Exported declarations and the comment above each."

# ── Stories ─────────────────────────────────────────────────────────────────────────────────
# Real calls, run at build time. Synthetic or modelled inputs only: never a recording of anyone.
[stories]
dir = "docs-site/stories"
path = ["apps/server", "apps/web", "apps/web/placement"]

[datasets.synthetic]
title = "Synthetic signals, generated in the story"
short = "Synthetic (seeded)"
provider = "docs-site/stories"
license = "MIT"
license_url = "https://github.com/polarizetech/olimex-shield/blob/main/LICENSE"
modality = "10-bit counts at 250 Hz, seeded pseudo-random; no person, no board"
why = "A story must never use a recording of a person. A seeded synthetic signal has a known answer, so each story is also a check, and it is badged as synthetic rather than measured."
cite = "Generated by the story's own code, shown beside its output."
